[package]
name = "tg-desktop-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "=1.0.100"
dirs = "=7.0.0"
dotenvy = "=0.15.7"
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "thread-pool", "x11", "wayland"] }
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.17"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tdlib-rs = { version = "=1.4.0", features = ["local-tdlib"] }
toml = "=1.2.1"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[build-dependencies]
tdlib-rs = { version = "=1.4.0", features = ["local-tdlib"] }
